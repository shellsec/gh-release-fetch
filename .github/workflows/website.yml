name: Software directory website

on:
  workflow_dispatch:
  release:
    types: [published, edited]
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'apps/**'
      - 'apps-mobile/**'
      - 'apps-tv/**'
      - 'apps-handheld/**'
      - 'apps-switch/**'
      - 'apps-ps4/**'
      - 'apps-ps5/**'
      - 'apps-vita/**'
      - 'apps-xbox/**'
      - 'tests/test_website.py'
      - '.github/workflows/website.yml'
  schedule:
    - cron: '13,43 * * * *'

permissions:
  contents: read

concurrency:
  group: software-directory-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'release' || github.event.release.tag_name == 'catalog-data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test catalog, download matching and SEO
        run: python -m unittest discover -s tests -p test_website.py
      - name: Check browser script syntax
        run: node --check website/assets/app.js
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Download and verify the client catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install requests
          mkdir -p build/pages-catalog/snapshot
          gh release download catalog-data --repo "$GITHUB_REPOSITORY" \
            --pattern 'gh-release-fetch-catalog.zip*' --dir build/pages-catalog
          cd build/pages-catalog
          sha256sum --check gh-release-fetch-catalog.zip.sha256
          cd ../..
          python -c 'from pathlib import Path; from tools.catalog_update import unpack; p = Path("build/pages-catalog"); unpack(p / "gh-release-fetch-catalog.zip", p / "snapshot")'
      - name: Build website from verified catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: ${{ vars.WEBSITE_SITE_URL || 'https://shellsec.com/gh-release-fetch' }}
        run: |
          python -m website.build --site-url "$SITE_URL" --catalog-root build/pages-catalog/snapshot --refresh-downloads
          cp build/pages-catalog/gh-release-fetch-catalog.zip.sha256 dist/site/catalog.sha256
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
